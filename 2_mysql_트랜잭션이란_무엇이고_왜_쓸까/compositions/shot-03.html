<template>
  <style>
      @font-face { font-family: "D2Coding"; src: url("assets/fonts/D2Coding-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; }
    #s03-tab {
      position: absolute; left: 44px; top: 12px; height: 93px; white-space: pre;
      font: 400 30px/93px "D2Coding", monospace; color: #e6edf3;
    }
    #s03-tab b { color: #3ddc97; font-weight: 400; }
    #s03-tab i { color: #7d8590; font-style: normal; }
    #s03-stage {
      position: absolute; left: 0; top: 105px; width: 1080px; height: 895px;
      display: flex; align-items: center; justify-content: center;
    }
    #s03-plate {
      position: absolute; left: 40px; top: calc(50% - 500px); width: 1000px; height: 1000px;
      background: #172033;
    }
    #s03-box {
      position: relative; text-align: left;
      font-family: "D2Coding", monospace; font-size: 120px; line-height: 1.17; color: #ffffff;
    }
    #s03-box .ln, #s03-box .ch { display: none; }
    #s03-box .ln { white-space: pre; }
    #s03-box .ln.p { display: block; }
    #s03-box .ch.p { display: inline; }
    #s03-box .u[data-c="1"]::after { content: "\258c"; color: #3ddc97; }
    #s03-box .k { color: #ff6b8b; }
    #s03-box .n { color: #b699ff; }
    #s03-box .s { color: #e6db74; }
    #s03-box .c { color: #8b98ad; }
    #s03-box .r { color: #ff4438; }
    #s03-box .w { color: #ffffff; }
  </style>
  <div id="root" data-composition-id="shot-03" data-width="1080" data-height="1920">
    <div id="s03-tab" data-layout-ignore><b>❯</b> mysql</div>
    <div id="s03-stage">
      <div id="s03-plate"></div>
      <div id="s03-box">
        <div class="ln"><span class="u lead"></span><span class="u ch r">T</span><span class="u ch r">R</span><span class="u ch r">A</span><span class="u ch r">N</span><span class="u ch r">S</span><span class="u ch r">A</span><span class="u ch r">C</span><span class="u ch r">T</span><span class="u ch r">I</span><span class="u ch r">O</span><span class="u ch r">N</span></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const box = document.getElementById("s03-box");
      const plate = document.getElementById("s03-plate");
      const units = box.querySelectorAll(".u");
      // [time, unit index, text scale, plate scaleY (0 = unchanged), tween duration]
      const STEPS = [[0.0,0,0,0,0.1],[0.111,1,0,0,0.1],[0.222,2,0,0,0.1],[0.333,3,0,0,0.1],[0.444,4,0,0,0.1],[0.556,5,0,0,0.1],[0.667,6,0,0,0.1],[0.778,7,0,0,0.1],[0.889,8,1.6742,0.5485,0.1],[1.0,9,1.5067,0.4936,0.1],[1.111,10,1.37,0.4488,0.1],[1.222,11,1.2558,0.4114,0.1]];
      tl.set(box, { scale: 1.8333 }, 0);
      tl.set(plate, { scaleY: 0.6006 }, 0);
      // [time, unit index]: cursor leaves when a block finishes typing
      const OFFS = [[1.683,11]];
      let prev = null;
      for (const [t, i, sc, by, d] of STEPS) {
        const u = units[i];
        if (u.classList.contains("lead")) tl.set(u.parentNode, { display: "block" }, t);
        else tl.set(u, { display: "inline" }, t);
        if (prev) tl.set(prev, { attr: { "data-c": "0" } }, t);
        tl.set(u, { attr: { "data-c": "1" } }, t);
        if (sc) {
          tl.to(box, { scale: sc, duration: d, ease: "power2.out" }, t);
          tl.to(plate, { scaleY: by, duration: d, ease: "power2.out" }, t);
        }
        prev = u;
      }
      for (const [t, i] of OFFS) tl.set(units[i], { attr: { "data-c": "0" } }, t);
      tl.set({}, {}, 3.444);
      window.__timelines["shot-03"] = tl;
    })();
  </script>
